# GitHub Pages'e otomatik yayın.
# main dalına her gönderimde (push) site derlenir ve yayınlanır.
# İlk kurulum: Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pages ayarlarını al
        id: pages
        uses: actions/configure-pages@v5

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Derle (statik dışa aktarım)
        run: npm run build
        env:
          # Alan adı ve alt klasör, Pages ayarlarından otomatik gelir.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # İletişim formu (ör. Formspree). Settings → Secrets and variables → Actions → Variables
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.CONTACT_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
